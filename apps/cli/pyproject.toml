[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bimdelta"
version = "0.9.0"
description = "Code review for building models: element-level IFC diffs in the terminal and in Git"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["ifc", "bim", "diff", "git", "openbim", "ifcopenshell"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    # Released together; keep in step with this package's version.
    "bimdelta-core==0.9.0",
    "typer>=0.15.4",  # older typer cannot read "X | None" options on Python 3.10
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
bimdelta = "bimdelta_cli.main:app"

[project.urls]
Repository = "https://github.com/kaan36875/BIMDelta"

[tool.hatch.build.targets.wheel]
packages = ["src/bimdelta_cli"]
# The built web app for `bimdelta serve`, copied in by CI (scripts/bundle_web.py); not in Git.
artifacts = ["src/bimdelta_cli/web/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/bimdelta_cli/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
