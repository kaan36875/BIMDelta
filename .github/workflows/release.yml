name: Release

# Push a tag vX.Y.Z (after `python scripts/set_version.py X.Y.Z`) to publish bimdelta-core
# and bimdelta: first to TestPyPI, then to PyPI. Both use trusted publishing, so no tokens
# are stored; each index needs this workflow registered as a publisher for both projects.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package versions
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          for path in ("packages/bimdelta-core/pyproject.toml", "apps/cli/pyproject.toml"):
              with open(path, "rb") as f:
                  project = tomllib.load(f)["project"]
              if project["version"] != tag:
                  sys.exit(f"{path}: version {project['version']} does not match tag v{tag}")
              pins = [d for d in project["dependencies"] if d.startswith("bimdelta-core")]
              if pins and pins != [f"bimdelta-core=={tag}"]:
                  sys.exit(f"{path}: {pins} does not pin bimdelta-core=={tag}")
          PY
      - run: pip install build
      - run: |
          python -m build packages/bimdelta-core --outdir dist
          python -m build apps/cli --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: python -m pip install --pre --find-links dist bimdelta pytest
      - run: bimdelta --version
      - run: python -m pytest apps/cli

  testpypi:
    needs: smoke
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
