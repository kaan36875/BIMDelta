name: Release

# Push a tag vX.Y.Z (after `python scripts/set_version.py X.Y.Z`) to publish bimdelta-core
# and bimdelta: first to TestPyPI, then to PyPI. Both use trusted publishing, so no tokens
# are stored. Publishers to register on each index (workflow release.yml):
#   bimdelta-core -> environment testpypi-core / pypi-core
#   bimdelta      -> environment testpypi / pypi

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package versions
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          for path in ("packages/bimdelta-core/pyproject.toml", "apps/cli/pyproject.toml"):
              with open(path, "rb") as f:
                  project = tomllib.load(f)["project"]
              if project["version"] != tag:
                  sys.exit(f"{path}: version {project['version']} does not match tag v{tag}")
              pins = [d for d in project["dependencies"] if d.startswith("bimdelta-core")]
              if pins and pins != [f"bimdelta-core=={tag}"]:
                  sys.exit(f"{path}: {pins} does not pin bimdelta-core=={tag}")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Bundle the web app for bimdelta serve
        run: python scripts/bundle_web.py
      - run: pip install build
      - run: |
          python -m build packages/bimdelta-core --outdir dist
          python -m build apps/cli --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: python -m pip install dist/*.whl pytest
      - run: bimdelta --version
      - run: python -m pytest apps/cli

  # PyPI accepts one pending trusted publisher per repository, workflow and environment, so
  # each package publishes from its own environment. The core goes first: the CLI pins it.
  publish:
    needs: smoke
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { index: testpypi, environment: testpypi-core, files: "bimdelta_core-*" }
          - { index: testpypi, environment: testpypi, files: "bimdelta-*" }
          - { index: pypi, environment: pypi-core, files: "bimdelta_core-*" }
          - { index: pypi, environment: pypi, files: "bimdelta-*" }
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: all/
      - run: mkdir dist && cp all/${{ matrix.files }} dist/ && ls dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ matrix.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
