name: CI

on:
  push:
    branches: [main, pivot]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - run: pip install -e "packages/bimdelta-core[dev]" -e "apps/server[dev]" -e "apps/cli[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest packages/bimdelta-core
      - run: pytest apps/server
      - run: pytest apps/cli
      - run: pytest apps/github-action

  # Runs the action from this checkout on two committed versions of a model.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Commit two versions of a model
        run: |
          pip install --quiet -e packages/bimdelta-core
          git config user.name ci
          git config user.email ci@example.com
          python apps/github-action/tests/make_fixture.py v1 selftest.ifc
          git add selftest.ifc && git commit --quiet -m "model v1"
          python apps/github-action/tests/make_fixture.py v2 selftest.ifc
          git commit --quiet -am "model v2"
      - id: bimdelta
        uses: ./apps/github-action
        with:
          base-ref: HEAD~1
          head-ref: HEAD
          comment-mode: "off"
      - name: Check the outputs
        env:
          FILES: ${{ steps.bimdelta.outputs.changed-files }}
          CHANGED: ${{ steps.bimdelta.outputs.has-changes }}
          REPORT: ${{ steps.bimdelta.outputs.report }}
        run: |
          cat "$REPORT"
          test "$FILES" = 1
          test "$CHANGED" = true
          grep -F "**1** added · **0** removed · **1** modified" "$REPORT"
          grep -F "FireRating: 1HR → 2HR" "$REPORT"
          grep -F "[View 3D diff](https://bimdelta.vercel.app/?v1_url=" "$REPORT"

  # Installs the built wheels into a clean virtual environment, the way users get them.
  cli-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Bundle the web app for bimdelta serve
        run: python scripts/bundle_web.py
      - run: pip install build
      - run: |
          python -m build packages/bimdelta-core --outdir dist
          python -m build apps/cli --outdir dist
      - name: Install into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          if [ -f "$RUNNER_TEMP/clean/Scripts/python.exe" ]; then
            echo "$RUNNER_TEMP/clean/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/clean/bin" >> "$GITHUB_PATH"
          fi
      - run: python -m pip install dist/*.whl pytest
      - run: bimdelta --version
      - name: The wheel carries the viewer
        run: python -c "from bimdelta_cli.serve import bundled_web_dir; assert bundled_web_dir()"
      - run: python -m pytest apps/cli

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t bimdelta-server .
      - name: Smoke test
        run: |
          docker run -d --name server -p 8001:8001 bimdelta-server
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8001/api/health && exit 0
            sleep 1
          done
          docker logs server
          exit 1
